<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Run 16 General - Question Viewer</title>
  <style>
    :root {
      --bg: #f1efe7;
      --bg-accent: #d9d6c9;
      --ink: #222222;
      --muted: #5c5c5c;
      --card: #ffffff;
      --accent: #b96b2f;
      --accent-2: #2c6f7b;
      --border: #d0c7b8;
      --shadow: rgba(0, 0, 0, 0.08);
      --answer-a: #2563eb;
      --answer-b: #d97706;
      --answer-c: #0f766e;
      --answer-d: #db2777;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Trebuchet MS", "Lucida Grande", "Tahoma", sans-serif;
      color: var(--ink);
      background: radial-gradient(circle at top left, #fefcf5 0%, #f1efe7 35%, #e7e1d5 100%);
      min-height: 100vh;
    }

    header {
      padding: 32px 24px 12px;
    }

    h1 {
      font-family: "Georgia", "Times New Roman", serif;
      font-size: 28px;
      margin: 0 0 6px;
      letter-spacing: 0.2px;
    }

    .subtitle {
      color: var(--muted);
      margin: 0;
      font-size: 14px;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      padding: 16px 24px 24px;
    }

    .control-block {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      box-shadow: 0 8px 18px var(--shadow);
    }

    .scene-filter-block {
      grid-column: 1 / -1;
      padding: 0;
      overflow: hidden;
    }

    .scene-filter-block summary {
      padding: 12px;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .scene-filter-inner {
      padding: 0 12px 12px;
      display: grid;
      gap: 10px;
    }

    .scene-filter-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .scene-filter-actions button {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 12px;
      cursor: pointer;
    }

    .scene-filter-list {
      max-height: 220px;
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px;
      background: #fff;
      display: grid;
      gap: 4px;
    }

    .scene-filter-option {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 6px;
      border-radius: 6px;
    }

    .scene-filter-option:hover {
      background: #f7f3e8;
    }

    .scene-filter-meta {
      font-size: 11px;
      color: var(--muted);
      line-height: 1.3;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    select, input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 14px;
      background: #fff;
    }

    .status {
      padding: 0 24px 8px;
      font-size: 14px;
      color: var(--muted);
    }

    .table {
      padding: 0 24px 32px;
    }

    .row {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 10px 20px var(--shadow);
      display: grid;
      gap: 12px;
      animation: fadeIn 0.4s ease;
    }

    .row-head {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 16px;
      align-items: center;
      font-size: 13px;
    }

    .badge {
      background: var(--bg-accent);
      border-radius: 999px;
      padding: 4px 10px;
      font-weight: 600;
      color: #3a362b;
    }

    .question {
      white-space: pre-wrap;
      line-height: 1.4;
      font-size: 15px;
      background: #faf8f2;
      padding: 12px;
      border-radius: 8px;
      border: 1px dashed var(--border);
    }

    .row-main {
      display: grid;
      gap: 12px;
    }

    .row-main.single {
      grid-template-columns: minmax(320px, 50%) 1fr;
      align-items: stretch;
    }

    .row-main.carousel-layout {
      grid-template-columns: minmax(320px, 50%) 1fr;
      align-items: stretch;
    }

    .images {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 10px;
    }

    .images.quad {
      grid-template-columns: repeat(2, 1fr);
    }

    .images.carousel {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .image-card {
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .image-card img {
      width: 100%;
      display: block;
      height: 120px;
      object-fit: cover;
    }

    .row-main.single .images {
      align-self: stretch;
    }

    .row-main.single .image-card {
      height: 100%;
      min-height: 320px;
    }

    .row-main.single .image-card img {
      flex: 1;
      height: 100%;
      object-fit: contain;
      background: #f6f1e7;
    }

    .row-main.carousel-layout .image-card {
      height: 100%;
      min-height: 360px;
    }

    .row-main.carousel-layout .image-card img {
      flex: 1;
      height: 100%;
      object-fit: contain;
      background: #f6f1e7;
    }

    .images.quad .image-card img {
      /* height: 320px; */
      object-fit: contain;
      background: #f6f1e7;
    }

    .carousel-thumbs {
      display: flex;
      object-fit: contain;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .image-path-list {
      font-size: 11px;
      color: var(--muted);
      line-height: 1.4;
      word-break: break-all;
    }

    .carousel-thumb {
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #fff;
      width: 86px;
      height: 64px;
      object-fit: cover;
      cursor: pointer;
      flex: 0 0 auto;
    }

    .carousel-thumb.active {
      outline: 2px solid var(--accent-2);
    }

    .image-path {
      font-size: 11px;
      padding: 6px 8px 8px;
      color: var(--muted);
      word-break: break-all;
    }

    details {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      background: #fff;
    }

    summary {
      cursor: pointer;
      font-weight: 600;
      color: var(--accent-2);
    }

    .answers {
      margin-top: 8px;
      display: grid;
      gap: 6px;
      font-size: 13px;
    }

    .answer-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px dashed var(--border);
      padding-bottom: 4px;
    }

    .answer-row.correct {
      font-weight: 700;
    }

    .answer-row:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .answer-A {
      color: var(--answer-a);
    }

    .answer-B {
      color: var(--answer-b);
    }

    .answer-C {
      color: var(--answer-c);
    }

    .answer-D {
      color: var(--answer-d);
    }

    .answer-label {
      font-weight: 700;
    }

    .badge.answer-A {
      background: color-mix(in srgb, var(--answer-a) 18%, var(--bg-accent));
    }

    .badge.answer-B {
      background: color-mix(in srgb, var(--answer-b) 18%, var(--bg-accent));
    }

    .badge.answer-C {
      background: color-mix(in srgb, var(--answer-c) 18%, var(--bg-accent));
    }

    .badge.answer-D {
      background: color-mix(in srgb, var(--answer-d) 18%, var(--bg-accent));
    }

    .pager {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      padding: 0 24px 32px;
    }

    .pager button {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }

    .pager button[disabled] {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .download-btn {
      margin-left: auto;
      background: var(--accent-2);
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .download-btn[disabled] {
      opacity: 0.6;
      cursor: progress;
    }

    .hint {
      font-size: 12px;
      color: var(--muted);
    }

    .download-section {
      padding: 0 24px 24px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .download-section button {
      background: var(--accent-2);
      color: #fff;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      box-shadow: 0 2px 6px var(--shadow);
      transition: all 0.2s ease;
    }

    .download-section button:hover {
      background: color-mix(in srgb, var(--accent-2) 85%, black);
      box-shadow: 0 4px 8px var(--shadow);
      transform: translateY(-1px);
    }

    .download-section button:active {
      transform: translateY(0);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <header>
    <h1 id="title">Question Viewer</h1>
    <p class="subtitle">Each row is one question with inputs and model answers. Click to expand the full model list.</p>
  </header>

  <section class="controls">
    <div class="control-block">
      <label for="runSelect">Run</label>
      <select id="runSelect"></select>
    </div>
    <div class="control-block">
      <label for="questionSet">Question set</label>
      <select id="questionSet">
        <option value="full">Full (test_*.json)</option>
        <option value="10k">10K subset (test_*_10K.json)</option>
      </select>
    </div>
    <details class="control-block scene-filter-block" id="sceneFilterDetails">
      <summary id="sceneFilterSummary">Scene filter (all)</summary>
      <div class="scene-filter-inner">
        <input id="sceneFilterSearch" placeholder="Search scene id, name, batch, comment" />
        <div class="scene-filter-actions">
          <button type="button" id="sceneSelectAllVisible">Select visible</button>
          <button type="button" id="sceneClearSelection">Clear selection</button>
        </div>
        <div class="scene-filter-list" id="sceneFilterList">
          <div class="hint">Loading scenes...</div>
        </div>
      </div>
    </details>
    <div class="control-block">
      <label for="questionIdFilter">Question ID Filter</label>
      <select id="questionIdFilter">
        <option value="">All question_id</option>
      </select>
    </div>
    <div class="control-block">
      <label for="objectCountFilter">Object count</label>
      <select id="objectCountFilter">
        <option value="">All</option>
      </select>
    </div>
    <div class="control-block">
      <label for="searchInput">Search (idx or text)</label>
      <input id="searchInput" placeholder="Type idx or question text" />
    </div>
    <div class="control-block">
      <label for="pageSize">Rows per page</label>
      <select id="pageSize">
        <option value="25" selected>25</option>
        <option value="50">50</option>
        <option value="100">100</option>
      </select>
    </div>
    <div class="control-block">
      <label for="imageTypeFilter">Image type</label>
      <select id="imageTypeFilter">
        <option value="">All</option>
        <option value="single">Single image (_i)</option>
        <option value="multi">Multi image (_g)</option>
      </select>
    </div>
  </section>

  <div class="status" id="status">Loading data...</div>
  <div class="status" id="diagnostics"></div>
  <div class="status" id="summary"></div>
  
  <section class="download-section">
    <button id="downloadJSON" onclick="downloadFilteredJSON()">⬇ Download Filtered (JSON)</button>
    <button id="downloadCSV" onclick="downloadFilteredCSV()">⬇ Download Filtered (CSV)</button>
    <button id="downloadAll" onclick="downloadAllJSON()">⬇ Download All (JSON)</button>
  </section>

  <div class="table" id="table"></div>
  <div class="pager" id="pager"></div>

  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script>
    const EXCLUDE_SCENES_FILE = "/data0/sebastian.cavada/compositional-physics/tiny_vqa_creation/visualization/exclude_scenes.txt";

    const fallbackRuns = [
      "run_06_contour",
      "run_06_general",
      "run_06_masking",
      "run_06_medium",
      "run_06_roi_circling",
      "run_06_scene_context",
      "run_06_soft",
      "run_06_stiff",
      "run_06_textual_context",
      "run_07_contour",
      "run_07_general",
      "run_07_general_karo",
      "run_07_masking",
      "run_07_medium",
      "run_07_roi_circling",
      "run_07_scene_context",
      "run_07_soft",
      "run_07_stiff",
      "run_07_textual_context",
      "run_08_contour",
      "run_08_general",
      "run_08_roi_circling",
      "run_08_scene_context",
      "run_08_textual_context",
      "run_09_general",
      "run_09_roi_circling_no_text",
      "run_09_roi_circling_yes_text",
      "run_09_soft_testttt",
      "run_10_general",
      "run_10_general_cam-stationary",
      "run_10_general_roi_circling",
      "run_10_general_test_persistance",
      "run_10_general_yms-variations",
      "run_10_roi_circling",
      "run_11_ablation_baseline",
      "run_11_black",
      "run_11_counterfactual_gravity",
      "run_11_counterfactual_shift",
      "run_11_counterfactual_smaller",
      "run_11_general",
      "run_11_general_levels",
      "run_11_general_old",
      "run_11_general_yms-variations",
      "run_11_roi_circling_no_text",
      "run_11_roi_circling_no_text_layout_position",
      "run_11_roi_circling_text",
      "run_11_roi_circling_text_layout_position",
      "run_12_ablation_baseline",
      "run_12_counterfactual_gravity",
      "run_12_counterfactual_shift",
      "run_12_counterfactual_smaller",
      "run_12_general",
      "run_12_general_yms-variations",
      "run_12_roi_circling_no_text",
      "run_12_roi_circling_no_text_layout_position",
      "run_12_roi_circling_text",
      "run_12_roi_circling_text_layout_position",
      "run_13_counterfactual_gravity",
      "run_13_counterfactual_shift",
      "run_13_counterfactual_smaller",
      "run_13_general",
      "run_13_general_obj_num",
      "run_13_general_yms-variations",
      "run_14_general",
      "run_14_general_obj_num",
      "run_15_general",
      "run_15_general_obj_num",
      "run_16_counterfactual_gravity",
      "run_16_counterfactual_shift",
      "run_16_counterfactual_smaller",
      "run_16_general",
      "run_16_general_obj_num",
      "run_16_test_general",
      "run_16_test_general_obj_num"
    ];
    const defaultRun = "run_28_general";

    const state = {
      runName: defaultRun,
      questions: [],
      answersByIdx: new Map(),
      correctByIdx: new Map(),
      filtered: [],
      totalFiltered: 0,
      pageCount: 1,
      summaryData: null,
      modelCount: 0,
      page: 1,
      pageSize: 25,
      filterId: "",
      searchText: "",
      questionSet: "full",
      imageType: "",
      objectCount: "",
      sceneOptions: [],
      selectedSceneIds: new Set(),
      excludedSceneIds: new Set(),
      excludeSceneSource: "",
      applySceneExcludeDefaultsOnNextRun: true,
      requestToken: 0,
      answerCache: new Map()
    };

    const urlParams = new URLSearchParams(window.location.search);
    const cacheBustEnabled = urlParams.has("nocache") || urlParams.has("cachebust");

    const elements = {
      title: document.getElementById("title"),
      status: document.getElementById("status"),
      diagnostics: document.getElementById("diagnostics"),
      summary: document.getElementById("summary"),
      table: document.getElementById("table"),
      pager: document.getElementById("pager"),
      runSelect: document.getElementById("runSelect"),
      questionSet: document.getElementById("questionSet"),
      sceneFilterDetails: document.getElementById("sceneFilterDetails"),
      sceneFilterSummary: document.getElementById("sceneFilterSummary"),
      sceneFilterSearch: document.getElementById("sceneFilterSearch"),
      sceneFilterList: document.getElementById("sceneFilterList"),
      sceneSelectAllVisible: document.getElementById("sceneSelectAllVisible"),
      sceneClearSelection: document.getElementById("sceneClearSelection"),
      questionIdFilter: document.getElementById("questionIdFilter"),
      objectCountFilter: document.getElementById("objectCountFilter"),
      searchInput: document.getElementById("searchInput"),
      pageSize: document.getElementById("pageSize"),
      imageTypeFilter: document.getElementById("imageTypeFilter")
    };

    function updateStatus(text) {
      elements.status.textContent = text;
    }

    function updateDiagnostics(lines) {
      elements.diagnostics.textContent = lines.join(" | ");
    }

    function updateSummary(text) {
      elements.summary.innerHTML = text;
    }

    function setTitle(runName) {
      elements.title.textContent = `${runName} - Question Viewer`;
    }

    function withCacheBust(url) {
      if (!cacheBustEnabled) return url;
      const sep = url.includes("?") ? "&" : "?";
      return `${url}${sep}ts=${Date.now()}`;
    }

    function getObjectCount(item) {
      const sourcePath = String(item.simulation_id || "");
      const match = sourcePath.match(/\/(random|random-cam-stationary)\/([^\/]+)/);
      return match ? match[2] : "";
    }

    async function loadRunList() {
      const apiResult = await fetchApiJson("/api/runs");
      if (apiResult.ok && Array.isArray(apiResult.data.runs) && apiResult.data.runs.length > 0) {
        return apiResult.data.runs;
      }
      const fileResult = await fetchApiJson(`runs.json?ts=${Date.now()}`);
      if (fileResult.ok && Array.isArray(fileResult.data) && fileResult.data.length > 0) {
        return fileResult.data;
      }
      return fallbackRuns;
    }

    const SCRATCH_PREFIXES = [
      "/scratch/project/eu-25-92/composite_physics/dataset/simulation_v4/dl3dv/",
      "/scratch/project/eu-25-92/composite_physics/dataset/simulation_v4_augmented/dl3dv/"
    ];
    const DATA_PREFIXES = [
      "/data0/sebastian.cavada/datasets/simulations_v4/dl3dv/",
      "/data0/sebastian.cavada/datasets/simulations_v4_augmented/dl3dv/"
    ];
    const WEB_LIGHT_PREFIX = "/data0/sebastian.cavada/datasets/simulations_web_light/dl3dv/";
    const FALLBACK_PREFIX = "/home/cavadahub/scsv/dataset-server/dl3dv/";

    function toWebLightPath(path) {
      if (path.startsWith(WEB_LIGHT_PREFIX)) {
        return path;
      }
      if (path.includes("/simulation_v4_augmented/")) {
        return path;
      }
      for (const prefix of SCRATCH_PREFIXES) {
        if (path.startsWith(prefix)) {
          return WEB_LIGHT_PREFIX + path.slice(prefix.length);
        }
      }
      for (const prefix of DATA_PREFIXES) {
        if (path.startsWith(prefix)) {
          return WEB_LIGHT_PREFIX + path.slice(prefix.length);
        }
      }
      const marker = "/dl3dv/";
      const markerIndex = path.indexOf(marker);
      if (markerIndex !== -1) {
        return WEB_LIGHT_PREFIX + path.slice(markerIndex + marker.length);
      }
      return path;
    }

    function toDisplayUrl(candidatePath) {
      if (!candidatePath) return "";
      if (candidatePath.startsWith("/")) {
        if (window.location.origin === "null") {
          return encodeURI(candidatePath);
        }
        return encodeURI(`${window.location.origin}${candidatePath}`);
      }
      return encodeURI(candidatePath);
    }

    function buildPngCandidates(path) {
      if (!path) return [];
      if (path.endsWith(".png.webp")) {
        const pngPath = path.slice(0, -5);
        return [pngPath, path];
      }
      if (path.endsWith(".png")) {
        return [path, `${path}.webp`];
      }
      if (path.endsWith(".webp")) {
        const pngPath = path.slice(0, -5);
        return [pngPath, path];
      }
      return [path, `${path}.webp`];
    }

    function buildImageCandidates(path) {
      if (!path) return [];
      const candidates = [];
      const karoPath = path.includes("/simulation_v4_augmented/")
        ? path.replace("/simulation_v4_augmented/", "/simulation_v4_augmented_augmented_karo/")
        : path;
      const rewritten = toWebLightPath(karoPath);
      const pushCandidates = candidatePath => {
        if (!candidatePath) return;
        if (candidatePath.startsWith("/")) {
          buildPngCandidates(candidatePath).forEach(candidate => {
            candidates.push(toDisplayUrl(candidate));
          });
        } else {
          buildPngCandidates(candidatePath).forEach(candidate => {
            candidates.push(toDisplayUrl(candidate));
          });
        }
      };

      pushCandidates(path);
      if (karoPath !== path) {
        pushCandidates(karoPath);
      }
      if (rewritten !== karoPath) {
        pushCandidates(rewritten);
      }

      for (const prefix of SCRATCH_PREFIXES) {
        if (karoPath.startsWith(prefix)) {
          const fallbackPath = FALLBACK_PREFIX + karoPath.slice(prefix.length);
          pushCandidates(fallbackPath);
          break;
        }
      }

      return Array.from(new Set(candidates));
    }

    function primaryImageUrl(path) {
      const candidates = buildImageCandidates(path);
      return candidates[0] || "";
    }

    const MAX_CONCURRENT_IMAGE_LOADS = 6;
    const lazyLoadQueue = [];
    let activeImageLoads = 0;

    const lazyImageObserver = "IntersectionObserver" in window
      ? new IntersectionObserver(entries => {
          entries.forEach(entry => {
            if (!entry.isIntersecting) return;
            loadLazyImage(entry.target);
            lazyImageObserver.unobserve(entry.target);
          });
        }, { rootMargin: "0px", threshold: 0.01 })
      : null;

    function drainLazyQueue() {
      if (activeImageLoads >= MAX_CONCURRENT_IMAGE_LOADS) return;
      while (activeImageLoads < MAX_CONCURRENT_IMAGE_LOADS && lazyLoadQueue.length > 0) {
        const img = lazyLoadQueue.shift();
        if (!img || !document.contains(img)) continue;
        if (img.dataset.loaded === "true") continue;
        const src = img.dataset.src;
        if (!src) continue;
        img.dataset.enqueued = "false";
        activeImageLoads += 1;
        const onDone = () => {
          activeImageLoads = Math.max(0, activeImageLoads - 1);
          img.removeEventListener("load", onDone);
          img.removeEventListener("error", onDone);
          drainLazyQueue();
        };
        img.addEventListener("load", onDone);
        img.addEventListener("error", onDone);
        img.src = src;
        img.dataset.loaded = "true";
      }
    }

    function enqueueLazyImage(img) {
      if (!img || img.dataset.loaded === "true") return;
      if (img.dataset.enqueued === "true") return;
      img.dataset.enqueued = "true";
      lazyLoadQueue.push(img);
      drainLazyQueue();
    }

    function loadLazyImage(img, { force = false } = {}) {
      if (!img || img.dataset.loaded === "true") return;
      const src = img.dataset.src;
      if (!src) return;
      if (force) {
        img.src = src;
        img.dataset.loaded = "true";
        return;
      }
      enqueueLazyImage(img);
    }

    function registerLazyImage(img) {
      if (!img) return;
      if (!lazyImageObserver) {
        loadLazyImage(img);
        return;
      }
      lazyImageObserver.observe(img);
    }

    function setImageCandidates(img, candidates, { immediate = false } = {}) {
      img.dataset.candidates = JSON.stringify(candidates || []);
      img.dataset.candidateIndex = "0";
      img.dataset.src = candidates[0] || "";
      img.dataset.loaded = "false";
      img.dataset.enqueued = "false";
      if (immediate) {
        loadLazyImage(img, { force: true });
      }
    }

    function setNextImageSource(img) {
      const candidates = JSON.parse(img.dataset.candidates || "[]");
      let index = Number(img.dataset.candidateIndex || 0);
      index += 1;
      if (index >= candidates.length) return;
      img.dataset.candidateIndex = String(index);
      img.dataset.src = candidates[index];
      img.dataset.loaded = "false";
      img.dataset.enqueued = "false";
      loadLazyImage(img, { force: true });
    }

    function createImageCard(path) {
      const card = document.createElement("div");
      card.className = "image-card";

      const img = document.createElement("img");
      const candidates = buildImageCandidates(path);
      setImageCandidates(img, candidates);
      img.alt = path;
      img.loading = "lazy";
      img.decoding = "async";
      img.addEventListener("error", () => setNextImageSource(img));
      registerLazyImage(img);
      card.appendChild(img);

      const label = document.createElement("div");
      label.className = "image-path";
      label.textContent = path;
      card.appendChild(label);

      return { card, img };
    }

    function buildCarousel(container, paths, showPaths = false) {
      if (!paths.length) return;
      container.classList.add("carousel");
      const main = createImageCard(paths[0]);
      container.appendChild(main.card);

      const thumbs = document.createElement("div");
      thumbs.className = "carousel-thumbs";
      paths.forEach((path, index) => {
        const thumb = document.createElement("img");
        thumb.className = `carousel-thumb${index === 0 ? " active" : ""}`;
        thumb.dataset.src = primaryImageUrl(path);
        thumb.dataset.loaded = "false";
        thumb.dataset.enqueued = "false";
        thumb.loading = "lazy";
        thumb.decoding = "async";
        thumb.alt = path;
        thumb.addEventListener("click", () => {
          const candidates = buildImageCandidates(path);
          setImageCandidates(main.img, candidates, { immediate: true });
          main.img.alt = path;
          thumbs.querySelectorAll(".carousel-thumb").forEach(el => el.classList.remove("active"));
          thumb.classList.add("active");
        });
        registerLazyImage(thumb);
        thumbs.appendChild(thumb);
      });
      container.appendChild(thumbs);
      if (showPaths) {
        const pathList = document.createElement("div");
        pathList.className = "image-path-list";
        pathList.innerHTML = paths.map(path => escapeHtml(path)).join("<br>");
        container.appendChild(pathList);
      }
    }

    function modelNameFromFile(file) {
      return file.replace(/_val\.json$/, "");
    }

    function escapeHtml(text) {
      return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll("\"", "&quot;")
        .replaceAll("'", "&#39;");
    }

    function formatQuestion(questionText, correctAnswer) {
      if (!questionText) return "";
      const lines = String(questionText).split("\n");
      const highlighted = lines.map(line => {
        const trimmed = line.trim();
        const optionMatch = trimmed.match(/^([ABCD])\\.(.*)$/);
        let lineHtml = "";
        if (optionMatch) {
          const letter = optionMatch[1];
          const restRaw = optionMatch[2];
          const spacer = restRaw.startsWith(" ") ? "&nbsp;" : "";
          lineHtml = `<span class="answer-label answer-${letter}">${letter}.</span>${spacer}${escapeHtml(restRaw.trimStart())}`;
        } else {
          lineHtml = escapeHtml(line);
        }
        if (correctAnswer && trimmed.startsWith(`${correctAnswer}.`)) {
          return `<strong>${lineHtml}</strong>`;
        }
        return lineHtml;
      });
      return highlighted.join("<br>");
    }

    function sanitizeFolderName(text) {
      return String(text || "question")
        .trim()
        .replace(/[^a-zA-Z0-9_-]+/g, "_")
        .replace(/^_+|_+$/g, "") || "question";
    }

    function extractPossibleAnswers(item) {
      const answers = [];
      if (item && Array.isArray(item.choices)) {
        item.choices.forEach((entry, index) => {
          if (!entry) return;
          if (typeof entry === "string") {
            const label = ["A", "B", "C", "D"][index] || String(index + 1);
            answers.push({ label, text: entry });
          } else if (entry.label && entry.text) {
            answers.push({ label: String(entry.label), text: String(entry.text) });
          }
        });
      } else if (item && item.choices && typeof item.choices === "object") {
        Object.entries(item.choices).forEach(([label, text]) => {
          if (text) answers.push({ label: String(label), text: String(text) });
        });
      }

      if (answers.length > 0) return answers;
      const questionText = String(item && item.question ? item.question : "");
      const lines = questionText.split("\n");
      lines.forEach(line => {
        const trimmed = line.trim();
        const match = trimmed.match(/^([A-D])[).]\\s*(.*)$/);
        if (match) {
          answers.push({ label: match[1], text: match[2] });
        }
      });
      return answers;
    }

    function extensionFromPath(path) {
      if (!path) return "";
      const clean = String(path).split("?")[0];
      const dot = clean.lastIndexOf(".");
      if (dot === -1) return "";
      return clean.slice(dot);
    }

    async function fetchFirstAvailable(candidates) {
      for (const url of candidates) {
        try {
          const response = await fetch(url);
          if (!response.ok) continue;
          return { blob: await response.blob(), url };
        } catch (err) {
          continue;
        }
      }
      return null;
    }

    function buildQuestionExport(item, correctAnswer, imageManifest) {
      const possibleAnswers = extractPossibleAnswers(item);
      const correctText = possibleAnswers.find(entry => entry.label === correctAnswer)?.text || null;
      return {
        question: item.question || "",
        possible_answers: possibleAnswers,
        correct_answer: correctAnswer || null,
        correct_answer_text: correctText,
        idx: item.idx || null,
        question_id: item.question_id || null,
        choice_type: item.choice_type || null,
        mode: item.mode || null,
        source: item.source || null,
        simulation_id: item.simulation_id || null,
        file_name: item.file_name || [],
        images: imageManifest,
        raw: item
      };
    }

    async function downloadQuestion(item, button) {
      if (typeof JSZip === "undefined") {
        updateStatus("Download requires JSZip. Check your network access.");
        return;
      }
      const originalLabel = button.textContent;
      button.disabled = true;
      button.textContent = "Preparing...";

      const folderName = `folder_${sanitizeFolderName(item.idx || "question")}`;
      const zip = new JSZip();
      const root = zip.folder(folderName);
      const imagesFolder = root.folder("images");
      const fileNames = Array.isArray(item.file_name) ? item.file_name : (item.file_name ? [item.file_name] : []);
      const imageManifest = [];

      for (let i = 0; i < fileNames.length; i += 1) {
        const path = fileNames[i];
        button.textContent = `Image ${i + 1}/${fileNames.length}`;
        const candidates = buildImageCandidates(path);
        const fetched = await fetchFirstAvailable(candidates);
        if (!fetched) {
          imageManifest.push({ original_path: path, status: "missing" });
          continue;
        }
        const ext = extensionFromPath(fetched.url) || extensionFromPath(path) || ".png";
        const name = `image_${String(i + 1).padStart(2, "0")}${ext}`;
        imagesFolder.file(name, fetched.blob);
        imageManifest.push({
          original_path: path,
          chosen_url: fetched.url,
          filename: name,
          status: "ok"
        });
      }

      const correctAnswer = state.correctByIdx.get(item.idx);
      const payload = buildQuestionExport(item, correctAnswer, imageManifest);
      root.file("question.json", JSON.stringify(payload, null, 2));

      button.textContent = "Zipping...";
      const blob = await zip.generateAsync({ type: "blob" });
      const downloadUrl = URL.createObjectURL(blob);
      const anchor = document.createElement("a");
      anchor.href = downloadUrl;
      anchor.download = `${folderName}.zip`;
      anchor.click();
      URL.revokeObjectURL(downloadUrl);

      button.textContent = originalLabel;
      button.disabled = false;
      updateStatus(`Download ready for ${item.idx}.`);
    }

    function debounce(fn, delayMs = 300) {
      let timerId = null;
      return (...args) => {
        if (timerId) {
          clearTimeout(timerId);
        }
        timerId = setTimeout(() => fn(...args), delayMs);
      };
    }

    async function fetchApiJson(url) {
      const finalUrl = withCacheBust(url);
      try {
        const response = await fetch(finalUrl);
        if (!response.ok) {
          return { ok: false, url: finalUrl, status: response.status };
        }
        return { ok: true, url: finalUrl, data: await response.json() };
      } catch (err) {
        return { ok: false, url: finalUrl, status: "network-error", error: err };
      }
    }

    async function fetchTextFile(url) {
      const finalUrl = withCacheBust(url);
      try {
        const response = await fetch(finalUrl);
        if (!response.ok) {
          return { ok: false, url: finalUrl, status: response.status };
        }
        return { ok: true, url: finalUrl, text: await response.text() };
      } catch (err) {
        return { ok: false, url: finalUrl, status: "network-error", error: err };
      }
    }

    function parseSceneIdsFromText(text) {
      const ids = new Set();
      String(text || "")
        .split(/\r?\n/g)
        .map(line => line.trim())
        .forEach(line => {
          if (!line || line.startsWith("#")) return;
          ids.add(line);
        });
      return ids;
    }

    async function loadExcludedSceneIds() {
      const candidates = [EXCLUDE_SCENES_FILE, "exclude_scenes.txt"];
      for (const path of candidates) {
        const result = await fetchTextFile(path);
        if (!result.ok) continue;
        state.excludedSceneIds = parseSceneIdsFromText(result.text);
        state.excludeSceneSource = path;
        return;
      }
      state.excludedSceneIds = new Set();
      state.excludeSceneSource = "";
    }

    function updateSceneFilterSummary() {
      const selectedCount = state.selectedSceneIds.size;
      const totalCount = state.sceneOptions.length;
      if (selectedCount === 0) {
        elements.sceneFilterSummary.textContent = `Scene filter (all${totalCount ? `, ${totalCount} scenes` : ""})`;
        return;
      }
      elements.sceneFilterSummary.textContent = `Scene filter (${selectedCount} selected of ${totalCount})`;
    }

    function sceneOptionMeta(option) {
      const parts = [];
      if (option.name) parts.push(option.name);
      if (option.batch) parts.push(`batch ${option.batch}`);
      if (option.comment) parts.push(option.comment);
      return parts.join(" | ");
    }

    function renderSceneOptions() {
      const search = (elements.sceneFilterSearch.value || "").trim().toLowerCase();
      elements.sceneFilterList.innerHTML = "";
      if (!state.sceneOptions.length) {
        elements.sceneFilterList.innerHTML = "<div class=\"hint\">No scene ids available for this run.</div>";
        updateSceneFilterSummary();
        return;
      }

      const fragment = document.createDocumentFragment();
      state.sceneOptions.forEach(option => {
        const sceneId = String(option.scene_id || "");
        if (!sceneId) return;
        const searchable = `${sceneId} ${option.name || ""} ${option.batch || ""} ${option.comment || ""}`.toLowerCase();
        if (search && !searchable.includes(search)) return;

        const label = document.createElement("label");
        label.className = "scene-filter-option";
        label.dataset.sceneId = sceneId;

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.value = sceneId;
        checkbox.checked = state.selectedSceneIds.has(sceneId);
        label.appendChild(checkbox);

        const textWrap = document.createElement("div");
        const title = document.createElement("div");
        title.textContent = sceneId;
        title.style.fontSize = "12px";
        title.style.fontWeight = "600";
        textWrap.appendChild(title);

        const meta = document.createElement("div");
        meta.className = "scene-filter-meta";
        meta.textContent = sceneOptionMeta(option) || "No extra metadata";
        textWrap.appendChild(meta);

        label.appendChild(textWrap);
        fragment.appendChild(label);
      });

      if (!fragment.childNodes.length) {
        elements.sceneFilterList.innerHTML = "<div class=\"hint\">No scenes match this search.</div>";
      } else {
        elements.sceneFilterList.appendChild(fragment);
      }
      updateSceneFilterSummary();
    }

    function buildApiParams({ includePaging } = { includePaging: true }) {
      const params = new URLSearchParams();
      params.set("run", state.runName);
      params.set("question_set", "full");
      if (state.filterId) params.set("question_id", state.filterId);
      if (state.searchText.trim()) params.set("search", state.searchText.trim());
      if (state.imageType) params.set("image_type", state.imageType);
      if (state.objectCount) params.set("object_count", state.objectCount);
      Array.from(state.selectedSceneIds)
        .sort()
        .forEach(sceneId => params.append("scene_id", sceneId));
      if (includePaging) {
        params.set("page", String(state.page));
        params.set("page_size", String(state.pageSize));
        params.set("include_answers", "0");
      }
      return params;
    }

    async function refreshFilteredData({ resetPage = false } = {}) {
      if (!state.runName) return;
      if (resetPage) {
        state.page = 1;
      }
      const token = ++state.requestToken;
      updateStatus(`Loading filtered rows for ${state.runName}...`);

      const pageParams = buildApiParams({ includePaging: true });
      const questionsResult = await fetchApiJson(`/api/questions?${pageParams.toString()}`);

      if (token !== state.requestToken) {
        return;
      }
      if (!questionsResult.ok) {
        throw new Error(`Failed to load questions (${questionsResult.status})`);
      }

      const payload = questionsResult.data || {};
      state.filtered = Array.isArray(payload.items) ? payload.items : [];
      state.totalFiltered = Number(payload.total) || 0;
      state.pageCount = Number(payload.page_count) || 1;
      state.modelCount = Number(payload.model_count) || 0;

      state.answersByIdx = new Map();
      state.correctByIdx = new Map();
      state.filtered.forEach(item => {
        const idx = item && item.idx ? item.idx : "";
        if (!idx) return;
        if (item.correct_answer) {
          state.correctByIdx.set(idx, item.correct_answer);
        }
        const answers = Array.isArray(item.model_answers) ? item.model_answers : [];
        if (answers.length > 0) {
          state.answerCache.set(idx, answers);
        }
        state.answersByIdx.set(idx, answers);
      });

      state.summaryData = payload.summary || null;

      render();
    }

    function filterQuestions({ resetPage = true } = {}) {
      refreshFilteredData({ resetPage }).catch(err => {
        console.error(err);
        updateStatus("Failed to load filtered data from API.");
      });
    }

    function buildAnswerSummaryText(answers, correctAnswer) {
      const answeredCount = answers.length;
      if (answeredCount === 0) {
        return "Models answered: 0";
      }
      if (!correctAnswer) {
        return `Models answered: ${answeredCount}`;
      }
      const correctCount = answers.filter(entry => entry.answer === correctAnswer).length;
      const correctness = ((correctCount / answeredCount) * 100).toFixed(1);
      return `Models answered: ${answeredCount} | avg correct: ${correctness}%`;
    }

    function renderAnswersList(answersWrap, answers, correctAnswer) {
      answersWrap.innerHTML = "";
      if (answers.length === 0) {
        const none = document.createElement("div");
        none.className = "hint";
        none.textContent = "No model answers available.";
        answersWrap.appendChild(none);
        return;
      }
      answers.forEach(entry => {
        const rowEl = document.createElement("div");
        const isCorrect = correctAnswer && entry.answer === correctAnswer;
        const answerClass = ["A", "B", "C", "D"].includes(entry.answer) ? ` answer-${entry.answer}` : "";
        rowEl.className = `answer-row${answerClass}${isCorrect ? " correct" : ""}`;
        rowEl.innerHTML = `<span>${entry.model}</span><span>${entry.answer}</span>`;
        answersWrap.appendChild(rowEl);
      });
    }

    async function ensureAnswersLoaded(item, details, summaryEl, answersWrap) {
      if (!details.open) return;
      const idx = String(item && item.idx ? item.idx : "");
      if (!idx) return;

      const cached = state.answerCache.get(idx);
      if (cached) {
        const correctAnswer = state.correctByIdx.get(idx);
        summaryEl.textContent = buildAnswerSummaryText(cached, correctAnswer);
        renderAnswersList(answersWrap, cached, correctAnswer);
        return;
      }

      if (details.dataset.loading === "true") return;
      details.dataset.loading = "true";
      summaryEl.textContent = "Models answered: loading...";
      answersWrap.innerHTML = "<div class=\"hint\">Loading model answers...</div>";
      try {
        const url = `/api/answers?run=${encodeURIComponent(state.runName)}&idx=${encodeURIComponent(idx)}`;
        const result = await fetchApiJson(url);
        if (!document.contains(details)) return;
        if (!result.ok) {
          summaryEl.textContent = "Models answered: failed to load";
          answersWrap.innerHTML = "<div class=\"hint\">Could not load model answers.</div>";
          return;
        }
        const payload = result.data || {};
        const answers = Array.isArray(payload.answers) ? payload.answers : [];
        const correctAnswer = payload.correct_answer || state.correctByIdx.get(idx);
        if (correctAnswer) {
          state.correctByIdx.set(idx, correctAnswer);
        }
        state.answerCache.set(idx, answers);
        state.answersByIdx.set(idx, answers);

        summaryEl.textContent = buildAnswerSummaryText(answers, correctAnswer);
        renderAnswersList(answersWrap, answers, correctAnswer);
      } finally {
        details.dataset.loading = "false";
      }
    }

    function render() {
      const total = state.totalFiltered;
      const pageCount = Math.max(1, state.pageCount || 1);
      if (state.page > pageCount) state.page = pageCount;

      if (lazyImageObserver) {
        lazyImageObserver.disconnect();
      }
      lazyLoadQueue.length = 0;

      const pageItems = state.filtered;

      elements.table.innerHTML = "";
      const fragment = document.createDocumentFragment();

      pageItems.forEach(item => {
        const row = document.createElement("div");
        row.className = "row";

        const head = document.createElement("div");
        head.className = "row-head";
        const correctAnswer = state.correctByIdx.get(item.idx);
        const objectCount = getObjectCount(item);
        head.innerHTML = `
          <span class="badge">${item.question_id}</span>
          <span class="badge">idx: ${item.idx}</span>
          <span class="badge">${item.choice_type || ""}</span>
          <span class="badge">${item.mode || ""}</span>
          <span class="badge">${item.source || ""}</span>
          ${objectCount ? `<span class="badge">objects: ${objectCount}</span>` : ""}
          ${correctAnswer ? `<span class="badge answer-${correctAnswer}">correct: ${correctAnswer}</span>` : ""}
        `;
        const downloadBtn = document.createElement("button");
        downloadBtn.className = "download-btn";
        downloadBtn.textContent = "Download";
        downloadBtn.addEventListener("click", () => downloadQuestion(item, downloadBtn));
        head.appendChild(downloadBtn);

        const question = document.createElement("div");
        question.className = "question";
        question.innerHTML = formatQuestion(item.question, correctAnswer);

        const rowMain = document.createElement("div");
        const isSingle = String(item.idx || "").endsWith("_i");

        const images = document.createElement("div");
        images.className = "images";
        const fileNames = Array.isArray(item.file_name) ? item.file_name : (item.file_name ? [item.file_name] : []);
        const tagCount = (item.question || "").split("<image>").length - 1;
        const isCarousel = tagCount >= 8 && fileNames.length >= 8;
        const isQuadCarousel = tagCount === 4 && fileNames.length >= 4;
        rowMain.className = `row-main${isSingle ? " single" : ""}${(isCarousel || isQuadCarousel) ? " carousel-layout" : ""}`;
        if (fileNames.length === 0) {
          const empty = document.createElement("div");
          empty.className = "hint";
          empty.textContent = "No images found.";
          images.appendChild(empty);
        } else {
          if (isCarousel) {
            buildCarousel(images, fileNames.slice(0, 8), true);
          } else if (tagCount === 4 && fileNames.length >= 4) {
            buildCarousel(images, fileNames.slice(0, 4), true);
          } else {
            fileNames.forEach(path => {
              const { card } = createImageCard(path);
              images.appendChild(card);
            });
          }
        }

        if (isSingle || isCarousel || isQuadCarousel) {
          rowMain.appendChild(images);
          rowMain.appendChild(question);
        } else {
          rowMain.appendChild(question);
          rowMain.appendChild(images);
        }

        const answerImages = document.createElement("div");
        answerImages.className = "images";
        if (tagCount === 4 && fileNames.length >= 8) {
          buildCarousel(answerImages, fileNames.slice(4, 8), true);
        }

        const details = document.createElement("details");
        const cachedAnswers = state.answerCache.get(item.idx) || [];
        const answers = cachedAnswers.length > 0 ? cachedAnswers : (state.answersByIdx.get(item.idx) || []);
        const answeredCount = answers.length;

        const summaryEl = document.createElement("summary");
        if (answeredCount > 0) {
          summaryEl.textContent = buildAnswerSummaryText(answers, correctAnswer);
        } else {
          summaryEl.textContent = "Models answered: click to load";
        }
        details.appendChild(summaryEl);

        const answersWrap = document.createElement("div");
        answersWrap.className = "answers";
        if (answeredCount > 0) {
          renderAnswersList(answersWrap, answers, correctAnswer);
        } else {
          answersWrap.innerHTML = "<div class=\"hint\">Open to load model answers.</div>";
        }
        details.appendChild(answersWrap);
        details.addEventListener("toggle", () => {
          if (details.open) {
            ensureAnswersLoaded(item, details, summaryEl, answersWrap);
          }
        });

        row.appendChild(head);
        row.appendChild(rowMain);
        if (answerImages.childElementCount > 0) {
          row.appendChild(answerImages);
        }
        row.appendChild(details);
        fragment.appendChild(row);
      });

      elements.table.appendChild(fragment);
      renderPager(total, pageCount);
      updateStatus(
        `Run ${state.runName}: page ${state.page}/${pageCount}, ${pageItems.length} rows loaded, ` +
        `${state.modelCount} models. Showing ${total} filtered results.`
      );
      renderSummary();
    }

    function renderSummary() {
      const summary = state.summaryData || {};
      const counts = summary.counts || { A: 0, B: 0, C: 0, D: 0 };
      const totalWithCorrect = Number(summary.total_with_correct) || 0;
      if (totalWithCorrect === 0) {
        updateSummary("Answer distribution: no correct answers found for this filter.");
        return;
      }
      const parts = ["A", "B", "C", "D"].map(key => {
        const count = Number(counts[key]) || 0;
        const pct = ((count / totalWithCorrect) * 100).toFixed(1);
        return `<span class=\"answer-${key}\">${key}</span>: ${count} (${pct}%)`;
      });
      updateSummary(`Answer distribution (correct, filtered): ${parts.join(" | ")}`);
    }

    function renderPager(total, pageCount) {
      elements.pager.innerHTML = "";
      const prev = document.createElement("button");
      prev.textContent = "Prev";
      prev.disabled = state.page <= 1;
      prev.addEventListener("click", () => {
        state.page = Math.max(1, state.page - 1);
        filterQuestions({ resetPage: false });
      });

      const next = document.createElement("button");
      next.textContent = "Next";
      next.disabled = state.page >= pageCount;
      next.addEventListener("click", () => {
        state.page = Math.min(pageCount, state.page + 1);
        filterQuestions({ resetPage: false });
      });

      const meta = document.createElement("div");
      meta.className = "hint";
      const start = total === 0 ? 0 : (state.page - 1) * state.pageSize + 1;
      const end = Math.min(total, state.page * state.pageSize);
      meta.textContent = `Page ${state.page}/${pageCount} (rows ${start}-${end} of ${total})`;

      elements.pager.appendChild(prev);
      elements.pager.appendChild(next);
      elements.pager.appendChild(meta);
    }

    async function loadRun(runName) {
      state.runName = runName;
      setTitle(runName);
      elements.runSelect.value = runName;
      state.questions = [];
      state.answersByIdx = new Map();
      state.correctByIdx = new Map();
      state.answerCache = new Map();
      state.filtered = [];
      state.totalFiltered = 0;
      state.pageCount = 1;
      state.summaryData = null;
      state.page = 1;
      state.filterId = "";
      state.searchText = "";
      state.imageType = "";
      state.objectCount = "";
      state.sceneOptions = [];
      state.selectedSceneIds = new Set();
      state.questionSet = "full";

      elements.searchInput.value = "";
      elements.imageTypeFilter.value = "";
      elements.sceneFilterSearch.value = "";
      elements.questionSet.value = "full";
      elements.questionSet.disabled = true;
      elements.questionIdFilter.innerHTML = "<option value=\"\">All question_id</option>";
      elements.objectCountFilter.innerHTML = "<option value=\"\">All</option>";
      elements.sceneFilterList.innerHTML = "<div class=\"hint\">Loading scenes...</div>";
      updateSceneFilterSummary();

      updateSummary("");
      updateStatus(`Loading metadata for ${runName}...`);
      updateDiagnostics([]);

      const metadataResult = await fetchApiJson(`/api/metadata?run=${encodeURIComponent(runName)}&question_set=full`);
      if (!metadataResult.ok) {
        throw new Error(`Failed to load run metadata (${metadataResult.status})`);
      }

      const metadata = metadataResult.data || {};
      const diagnostics = [];
      if (metadata.question_file) diagnostics.push(`question: ${metadata.question_file}`);
      if (Array.isArray(metadata.results_dirs)) diagnostics.push(`results_dirs: ${metadata.results_dirs.length}`);
      if (metadata.correct_answers_file) diagnostics.push(`correct: ${metadata.correct_answers_file}`);
      updateDiagnostics(diagnostics);

      const questionIds = Array.isArray(metadata.question_ids) ? metadata.question_ids : [];
      questionIds.forEach(id => {
        const option = document.createElement("option");
        option.value = id;
        option.textContent = id;
        elements.questionIdFilter.appendChild(option);
      });

      const objectCounts = Array.isArray(metadata.object_counts) ? metadata.object_counts : [];
      objectCounts.forEach(count => {
        const option = document.createElement("option");
        option.value = count;
        option.textContent = count;
        elements.objectCountFilter.appendChild(option);
      });

      const sceneOptions = Array.isArray(metadata.scene_options) ? metadata.scene_options : [];
      if (sceneOptions.length > 0) {
        state.sceneOptions = sceneOptions;
      } else {
        const sceneIds = Array.isArray(metadata.scene_ids) ? metadata.scene_ids : [];
        state.sceneOptions = sceneIds.map(sceneId => ({ scene_id: sceneId, name: "", batch: "", comment: "" }));
      }

      if (state.applySceneExcludeDefaultsOnNextRun) {
        const allSceneIds = state.sceneOptions
          .map(option => String(option.scene_id || ""))
          .filter(Boolean);
        const selected = allSceneIds.filter(sceneId => !state.excludedSceneIds.has(sceneId));
        if (selected.length > 0) {
          state.selectedSceneIds = new Set(selected);
        } else {
          state.selectedSceneIds = new Set(allSceneIds);
        }
        state.applySceneExcludeDefaultsOnNextRun = false;
      }

      if (state.excludeSceneSource) {
        const excludedInRun = state.sceneOptions.filter(option => state.excludedSceneIds.has(String(option.scene_id || ""))).length;
        diagnostics.push(`exclude_scenes: ${excludedInRun} matched (${state.excludeSceneSource})`);
      }
      updateDiagnostics(diagnostics);
      renderSceneOptions();

      state.modelCount = Number(metadata.model_count) || 0;
      await refreshFilteredData({ resetPage: true });
    }

    function populateRunSelect(runs) {
      elements.runSelect.innerHTML = "";
      runs.forEach(run => {
        const option = document.createElement("option");
        option.value = run;
        option.textContent = run;
        elements.runSelect.appendChild(option);
      });
    }

    function enrichItemWithAnswers(item) {
      const enrichedItem = { ...item };
      const correctAnswer = state.correctByIdx.get(item.idx);
      if (correctAnswer) {
        enrichedItem.correct_answer = correctAnswer;
      }
      const modelAnswers = state.answersByIdx.get(item.idx);
      if (modelAnswers) {
        enrichedItem.model_answers = modelAnswers;
      }
      return enrichedItem;
    }

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function downloadFilteredJSON() {
      if (!state.filtered || state.filtered.length === 0) {
        alert("No data to download. Please load a run first.");
        return;
      }
      
      const dataToDownload = state.filtered.map(enrichItemWithAnswers);
      const jsonStr = JSON.stringify(dataToDownload, null, 2);
      const blob = new Blob([jsonStr], { type: "application/json" });
      downloadBlob(blob, `${state.runName}_filtered_${state.filtered.length}_questions.json`);
    }

    function downloadAllJSON() {
      if (!state.questions || state.questions.length === 0) {
        alert("No data to download. Please load a run first.");
        return;
      }
      
      const dataToDownload = state.questions.map(enrichItemWithAnswers);
      const jsonStr = JSON.stringify(dataToDownload, null, 2);
      const blob = new Blob([jsonStr], { type: "application/json" });
      downloadBlob(blob, `${state.runName}_all_${state.questions.length}_questions.json`);
    }

    function downloadFilteredCSV() {
      if (!state.filtered || state.filtered.length === 0) {
        alert("No data to download. Please load a run first.");
        return;
      }

      // Prepare CSV headers
      const headers = [
        "idx",
        "question_id", 
        "question",
        "choices",
        "correct_answer",
        "simulation_id",
        "image"
      ];

      // Add model columns dynamically
      const modelNames = modelFiles.map(f => f.replace(/\.json$/, ""));
      modelNames.forEach(modelName => {
        headers.push(`model_${modelName}`);
      });

      // Build CSV rows
      const rows = [headers.join(",")];
      
      state.filtered.forEach(item => {
        const row = [];
        row.push(escapeCSV(item.idx));
        row.push(escapeCSV(item.question_id));
        row.push(escapeCSV(item.question));
        row.push(escapeCSV(JSON.stringify(item.choices)));
        
        const correctAnswer = state.correctByIdx.get(item.idx) || "";
        row.push(escapeCSV(correctAnswer));
        
        row.push(escapeCSV(item.simulation_id));
        row.push(escapeCSV(item.image));

        // Add model answers
        const modelAnswers = state.answersByIdx.get(item.idx) || {};
        modelNames.forEach(modelName => {
          const answer = modelAnswers[modelName] || "";
          row.push(escapeCSV(answer));
        });

        rows.push(row.join(","));
      });

      const csvStr = rows.join("\n");
      const blob = new Blob([csvStr], { type: "text/csv" });
      downloadBlob(blob, `${state.runName}_filtered_${state.filtered.length}_questions.csv`);
    }

    function escapeCSV(value) {
      if (value === null || value === undefined) {
        return "";
      }
      const str = String(value);
      if (str.includes(",") || str.includes('"') || str.includes("\n")) {
        return `"${str.replace(/"/g, '""')}"`;
      }
      return str;
    }

    async function init() {
      try {
        await loadExcludedSceneIds();
        const runs = await loadRunList();
        populateRunSelect(runs);
        const initialRun = runs.includes(defaultRun) ? defaultRun : (runs[0] || "");
        if (!initialRun) {
          throw new Error("No runs available.");
        }
        await loadRun(initialRun);
      } catch (err) {
        console.error(err);
        updateStatus("Failed to load data. Check the diagnostics line for missing URLs or network errors.");
      }
    }

    const debouncedSearchFilter = debounce(() => {
      filterQuestions({ resetPage: true });
    }, 450);

    elements.sceneFilterSearch.addEventListener("input", () => {
      renderSceneOptions();
    });

    elements.sceneFilterList.addEventListener("change", event => {
      const target = event.target;
      if (!target || target.tagName !== "INPUT" || target.type !== "checkbox") return;
      const sceneId = String(target.value || "");
      if (!sceneId) return;
      if (target.checked) {
        state.selectedSceneIds.add(sceneId);
      } else {
        state.selectedSceneIds.delete(sceneId);
      }
      updateSceneFilterSummary();
      filterQuestions({ resetPage: true });
    });

    elements.sceneSelectAllVisible.addEventListener("click", () => {
      const checkboxes = elements.sceneFilterList.querySelectorAll("input[type=\"checkbox\"]");
      let changed = false;
      checkboxes.forEach(checkbox => {
        const sceneId = String(checkbox.value || "");
        if (!sceneId) return;
        if (!state.selectedSceneIds.has(sceneId)) {
          state.selectedSceneIds.add(sceneId);
          checkbox.checked = true;
          changed = true;
        }
      });
      if (changed) {
        updateSceneFilterSummary();
        filterQuestions({ resetPage: true });
      }
    });

    elements.sceneClearSelection.addEventListener("click", () => {
      if (state.selectedSceneIds.size === 0) return;
      state.selectedSceneIds.clear();
      renderSceneOptions();
      filterQuestions({ resetPage: true });
    });

    elements.questionIdFilter.addEventListener("change", event => {
      state.filterId = event.target.value;
      filterQuestions({ resetPage: true });
    });

    elements.runSelect.addEventListener("change", event => {
      const runName = event.target.value;
      if (runName) {
        loadRun(runName).catch(err => {
          console.error(err);
          updateStatus("Failed to load data. Check the diagnostics line for missing URLs or network errors.");
        });
      }
    });

    elements.questionSet.addEventListener("change", event => {
      state.questionSet = "full";
      elements.questionSet.value = "full";
    });

    elements.objectCountFilter.addEventListener("change", event => {
      state.objectCount = event.target.value;
      filterQuestions({ resetPage: true });
    });

    elements.searchInput.addEventListener("input", event => {
      state.searchText = event.target.value;
      debouncedSearchFilter();
    });

    elements.pageSize.addEventListener("change", event => {
      state.pageSize = Number(event.target.value) || 50;
      filterQuestions({ resetPage: true });
    });

    elements.imageTypeFilter.addEventListener("change", event => {
      state.imageType = event.target.value;
      filterQuestions({ resetPage: true });
    });

    init();
  </script>
</body>
</html>
